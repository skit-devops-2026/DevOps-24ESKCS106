server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index home.html index.html;

    # Gzip compression for performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Milestone M5: GET /health returns running Git commit SHA
    location = /health {
        default_type text/plain;
        alias /usr/share/nginx/html/health;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Milestone M6: Nginx stub_status metrics endpoint for Prometheus exporter
    location /stub_status {
        stub_status;
        allow all;
    }

    # Static assets caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Static site routing with home.html fallback
    location / {
        try_files $uri $uri/ /home.html;
    }

    # Error handling
    error_page 404 /home.html;
}
